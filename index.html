```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        .heart {
            position: relative;

            /* Se adaptează automat la dimensiunea ecranului */
            width: min(600px, 90vw);
            height: min(600px, 90vw);

            /* Variabilă folosită și în JavaScript */
            --heart-scale: min(15px, 2.5vw);
        }

        .text {
            position: absolute;

            left: 50%;
            top: 50%;

            color: #ff4d6d;

            /*
                Fontul se adaptează și el la ecran.
                Pe desktop = 17px
                Pe telefon = mai mic
            */
            font-size: clamp(9px, 1.4vw, 17px);

            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                0 0 5px #ff4d6d,
                0 0 10px #ff4d6d;
        }

        /* TEXTUL DIN MIJLOC */
        .center {
            position: absolute;

            left: 52.5%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            /*
                Responsive:
                desktop -> 32px
                telefon -> aproximativ 20-25px
            */
            font-size: clamp(20px, 5vw, 32px);

            font-weight: bold;

            white-space: nowrap;

            text-align: center;

            z-index: 100;

            text-shadow:
                0 0 10px #ff4d6d,
                0 0 20px #ff4d6d;
        }
    </style>
</head>

<body>

    <div class="heart" id="heart">

        <div class="center">
            I love you ❤️
        </div>

    </div>


    <script>

        const heart = document.getElementById("heart");

        const totalItems = 100;

        const texts = [];


        for (let i = 0; i < totalItems; i++) {

            const text = document.createElement("div");

            text.className = "text";

            text.innerText = "I love you";

            heart.appendChild(text);

            texts.push(text);
        }


        let rotation = 0;


        function animate() {

            rotation += 0.5;


            // Dimensiunea actuală a inimii
            const heartSize = heart.offsetWidth;

            // Pe desktop:
            // 600px -> scale 15
            //
            // Pe telefon:
            // scale-ul se micșorează automat
            const scale = heartSize / 40;


            texts.forEach((text, i) => {

                const t =
                    (Math.PI * 2 * i) / totalItems;


                // Forma inimii
                const x =
                    16 * Math.pow(Math.sin(t), 3);

                const y =
                    13 * Math.cos(t)
                    - 5 * Math.cos(2 * t)
                    - 2 * Math.cos(3 * t)
                    - Math.cos(4 * t);


                const posX = x * scale;

                const posY = -y * scale;


                // Rotirea textului
                const angle =
                    t * (180 / Math.PI)
                    + rotation;


                text.style.transform = `
    translate(
        calc(-50% + ${posX}px),
        calc(-50% + ${posY}px)
    )
    rotate(${angle}deg)
`;

            });


            requestAnimationFrame(animate);
        }


        animate();

    </script>

</body>
</html>
