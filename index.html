```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        .heart {
            position: relative;

            width: 600px;
            height: 600px;
        }

        .text {
            position: absolute;

            left: 50%;
            top: 50%;

            color: #ff4d6d;

            font-size: 17px;
            font-weight: bold;

            white-space: nowrap;

            text-shadow:
                0 0 5px #ff4d6d,
                0 0 10px #ff4d6d;
        }

        /* TEXTUL DIN MIJLOC */
        .center {
            position: absolute;

            left: 60%;
            top: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-size: 32px;
            font-weight: bold;

            white-space: nowrap;

            text-align: center;

            z-index: 100;

            text-shadow:
                0 0 10px #ff4d6d,
                0 0 20px #ff4d6d;
        }
    </style>
</head>

<body>

    <div class="heart" id="heart">

        <div class="center">
            I love you ❤️
        </div>

    </div>


    <script>

        const heart = document.getElementById("heart");

        const totalItems = 100;

        const texts = [];


        for (let i = 0; i < totalItems; i++) {

            const text = document.createElement("div");

            text.className = "text";

            text.innerText = "I love you";

            heart.appendChild(text);

            texts.push(text);
        }


        let rotation = 0;


        function animate() {

            rotation += 0.5;


            texts.forEach((text, i) => {

                const t =
                    (Math.PI * 2 * i) / totalItems;


                // Forma inimii
                const x =
                    16 * Math.pow(Math.sin(t), 3);

                const y =
                    13 * Math.cos(t)
                    - 5 * Math.cos(2 * t)
                    - 2 * Math.cos(3 * t)
                    - Math.cos(4 * t);


                const scale = 15;


                const posX = x * scale;

                const posY = -y * scale;


                // Rotirea textului
                const angle =
                    t * (180 / Math.PI)
                    + rotation;


                text.style.transform = `
                    translate(${posX}px, ${posY}px)
                    rotate(${angle}deg)
                `;

            });


            requestAnimationFrame(animate);
        }


        animate();

    </script>

</body>
</html>
```
